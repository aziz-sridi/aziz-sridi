name: Refresh One-Punch Commits

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/aziz-ascii.svg"
      - "assets/saitama/**"
      - ".github/workflows/profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate artwork from public contributions
        run: python3 scripts/generate_profile.py --refresh
      - name: Check generated artwork
        run: python3 scripts/check_profile.py
      - name: Commit updated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.json assets/saitama-intro*.svg assets/one-punch-commits*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh One-Punch Commits artwork"
            git push origin HEAD:main
          fi
